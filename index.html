<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camelback Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --fg: #1a1a1a;
      --fg-muted: #555;
      --accent: #b44a2d;
      --bg: #faf9f7;
      --rule: #ddd;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding: 60px 24px 80px;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    p {
      color: var(--fg-muted);
      margin-bottom: 14px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--rule);
      margin: 32px 0;
    }

    a {
      color: var(--fg);
      text-decoration-color: var(--rule);
      text-underline-offset: 3px;
      transition: text-decoration-color 0.15s;
    }

    a:hover {
      text-decoration-color: var(--fg);
    }

    .links {
      color: var(--fg-muted);
    }

    .links a {
      color: var(--fg-muted);
    }

    .links a:hover {
      color: var(--fg);
    }
  </style>
</head>
<body>

  <div class="page">

    <h1>Camelback Tech</h1>

    <p>Fractional CTO, data engineering, and AI strategy for Democratic campaigns and progressive organizations.</p>

    <hr>

    <p>Camelback Tech is led by <a href="https://jackwelty.com">Jack Welty</a>, former Deputy Chief Analytics Officer for Harris for President.</p>

    <p><a href="https://schwenzfeier.github.io/files/AI_Whitepaper_2025.pdf">Paper: Generative AI on Campaigns</a></p>

    <hr>

    <p class="links">
      <a href="mailto:jack@camelback.tech">jack@camelback.tech</a><br>
      <a href="https://github.com/jackwelty">GitHub</a> · <a href="https://www.linkedin.com/in/jackwelty">LinkedIn</a>
    </p>

  </div>

</body>
</html>
